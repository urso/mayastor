name: Scheduled Sync Upstream

on:
  schedule:
    # Daily at 2 AM UTC - commented out until testing is complete
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: read

jobs:
  discover-new-releases:
    name: Discover New Release Branches
    runs-on: ubuntu-latest
    outputs:
      new_releases: ${{ steps.find-new-releases.outputs.new_releases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new upstream release branches
        id: find-new-releases
        run: |
          # Add upstream remote
          git remote add upstream https://github.com/openebs/mayastor.git || true
          git fetch upstream
          git fetch origin

          # Get upstream release branches
          upstream_releases=$(git branch -r | grep 'upstream/release/' | sed 's|upstream/||' | sed 's|^[[:space:]]*||')

          # Get our release branches
          our_releases=$(git branch -r | grep 'origin/release/' | sed 's|origin/||' | sed 's|^[[:space:]]*||')

          # Find releases in upstream that we don't have
          new_releases=()
          for branch in $upstream_releases; do
            if ! echo "$our_releases" | grep -qx "$branch"; then
              echo "🆕 New upstream release branch: $branch"
              new_releases+=("$branch")
            fi
          done

          # Convert to JSON array
          if [ ${#new_releases[@]} -eq 0 ]; then
            echo "No new release branches found"
            echo "new_releases=[]" >> $GITHUB_OUTPUT
          else
            json_releases=$(printf '%s\n' "${new_releases[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "new_releases=${json_releases}" >> $GITHUB_OUTPUT
          fi

  create-release-branches:
    name: Create ${{ matrix.branch }}
    runs-on: ubuntu-latest
    needs: discover-new-releases
    if: needs.discover-new-releases.outputs.new_releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-new-releases.outputs.new_releases) }}
    steps:
      - name: Trigger create release branch workflow
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          gh workflow run create-release-branch.yml \
            --repo "${{ github.repository }}" \
            --ref develop \
            -f release_branch="${{ matrix.branch }}" \
            -f base_branch="develop"

          echo "✅ Triggered create-release-branch for: ${{ matrix.branch }}"

  discover-branches:
    name: Discover Branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.find-branches.outputs.branches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find branches to sync
        id: find-branches
        run: |
          git fetch origin

          # Find branches matching pattern: develop, develop-*, release/*
          branches=$(git branch -r | \
            grep -E 'origin/(develop|develop-.*|release/.*)$' | \
            sed 's|origin/||' | \
            sed 's|^[[:space:]]*||' | \
            grep -v HEAD | \
            sort -u)

          # Filter: only keep branches that have sync scripts
          valid_branches=()
          for branch in $branches; do
            if git ls-tree -r "origin/$branch" --name-only | grep -q "^scripts/xata/sync-upstream.sh$"; then
              echo "✅ Including $branch (has sync scripts)"
              valid_branches+=("$branch")
            else
              echo "⏭️  Skipping $branch (no sync scripts)"
            fi
          done

          # Convert to JSON array
          if [ ${#valid_branches[@]} -eq 0 ]; then
            echo "No valid branches found"
            echo "branches=[]" >> $GITHUB_OUTPUT
          else
            json_branches=$(printf '%s\n' "${valid_branches[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "branches=${json_branches}" >> $GITHUB_OUTPUT
          fi

  sync-branches:
    name: Sync ${{ matrix.branch }}
    runs-on: ubuntu-latest
    needs: discover-branches
    if: needs.discover-branches.outputs.branches != '[]'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
    steps:
      - name: Trigger sync workflow
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          gh workflow run sync-upstream.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ matrix.branch }}"

          echo "✅ Triggered sync for branch: ${{ matrix.branch }}"
