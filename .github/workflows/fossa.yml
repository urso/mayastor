name: Fossa CLI
on:
  workflow_dispatch:
  # Original triggers (disabled):
  #push:
  #  branches:
  #    - 'develop'
  #    - 'release/**'

jobs:
  fossa-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GIT_TOKEN }}
      - uses: fossas/fossa-action@v1.4.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
