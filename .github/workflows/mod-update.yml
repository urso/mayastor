name: Submodule Update
on:
  workflow_dispatch:
    inputs:
      submodules:
        description: 'Override modules to update via comma-separated list of names'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  submodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update submodules
        run: ./utils/dependencies/scripts/git/submodule-branches.sh -u -m "${{ inputs.submodules }}"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(ci): update git submodules"
          committer: GitHub <noreply@github.com>
          title: "chore: update git submodules (${{ github.ref_name }})"
          labels: |
            submodule-update
            automated
          draft: false
          signoff: true
          delete-branch: true
          branch: update-submodules/${{ github.ref_name }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Auto-approve PR
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr review ${{ steps.cpr.outputs.pull-request-number }} \
            --repo "${{ github.repository }}" \
            --approve \
            --body "Auto-approved by GitHub Actions"

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} \
            --repo "${{ github.repository }}" \
            --auto --merge --delete-branch
